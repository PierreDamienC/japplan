name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Lire la version de package.json
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Doit matcher kotlinOptions.jvmTarget dans android/app/build.gradle.
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: gradlew assembleDebug
        working-directory: android
        # gradlew n'est pas suivi comme exécutable dans git (le seul usage jusqu'ici
        # était gradlew.bat en local sous Windows, voir deploy.ps1). org.gradle.java.home
        # dans gradle.properties pointe le JBR d'Android Studio en local (chemin Windows,
        # voir CLAUDE.md) — inexistant sur ce runner Linux, donc on le surcharge en ligne
        # de commande avec le JDK installé par setup-java ci-dessus (priorité sur le fichier).
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"
      - name: Renommer l'APK avec la version
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             "android/app/build/outputs/apk/debug/japplan-${{ steps.version.outputs.value }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: japplan-${{ steps.version.outputs.value }}.apk
          path: android/app/build/outputs/apk/debug/japplan-${{ steps.version.outputs.value }}.apk
          retention-days: 14

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Trivy scan (deps + secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
